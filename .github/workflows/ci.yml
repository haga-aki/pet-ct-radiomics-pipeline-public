name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26,<2.0" \
            "pydicom>=2.4" \
            "nibabel>=5.0" \
            "matplotlib>=3.7" \
            "PyYAML>=6.0"
          python -m pip install "SimpleITK>=2.3" "pandas>=2.0"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: |
          python -m py_compile \
            run_pipeline.py \
            suv_converter.py \
            create_final_suv.py \
            radiomics_grid_policy.py \
            qc_reporting.py \
            suv_timing.py \
            mask_inventory.py \
            visualize_mask_verification.py
